common:
  launch:
    enable_voice: true
    audio_input_device: auto
    audio_input_volume_percent: 100
  nodes:
    llm_control_task_server:
      ros__parameters:
        yolo_topic: /yolo/detected_result
        depth_topic: /yolo/detected_result/depth
        camera_info_topic: /camera/camera/aligned_depth_to_color/camera_info
        pick_classes:
        - elongated_object
        - cube
        - stone
        place_classes:
        - box
        preview_max_age_sec: 30.0
        detection_max_age_sec: 1.0
        vision_wait_timeout_sec: 3.5
        tf_wait_timeout_sec: 0.6
        moveit:
          frames:
            base_frame: base_link
            ee_frame: tool0
          groups:
            arm: robot_arm
            gripper: hand
          move_groups:
            fairino: /move_group_fairino
            kdl: /move_group_kdl
          ik:
            default: fairino
          pipeline:
            default: fairino
          planner:
            default: birrt*
          readiness:
            timeout_sec: 10.0
            allow_cross_client_fallback: true
        workspace_min_xy:
        - -0.9
        - -0.9
        workspace_max_xy:
        - 0.9
        - 0.9
        grasp_above: 0.04
        grasp_offset: 0.013
        place_offset: 0.08
        descend_to_box: 0.04
        grasp.elongated_object.roll: 0.0
        grasp.elongated_object.pitch: -180.0
        grasp.elongated_object.yaw_offset: 90.0
        grasp.cube.roll: 0.0
        grasp.cube.pitch: -180.0
        grasp.cube.yaw_offset: 0.0
        grasp.stone.roll: 0.0
        grasp.stone.pitch: -180.0
        grasp.stone.yaw_offset: -45.0
        pregrasp_pose.x: 0.1
        pregrasp_pose.y: 0.35
        pregrasp_pose.z: 0.3
        pregrasp_pose.roll: 0.0
        pregrasp_pose.pitch: -180.0
        pregrasp_pose.yaw: 100.0
        reset_stop_timeout_sec: 5.0
        arm_max_velocity: 0.2
        arm_max_acceleration: 0.2
        allowed_planning_time: 30.0
        batch_box_zone_radius_m: 0.08
        batch_rebind_max_distance_m: 0.10
        batch_rebind_timeout_sec: 5.0
        batch_rebind_stable_frames: 2
    voice_wake_node:
      ros__parameters:
        sample_rate: 16000
        num_threads: 2
        provider: cpu
        kws_keywords_score: 1.0
        kws_keywords_threshold: 0.25
        kws_score_wake_zh: 3.0
        kws_threshold_wake_zh: 0.05
        kws_score_wake_en: 1.0
        kws_threshold_wake_en: 0.15
        kws_num_trailing_blanks: 1
        wake_dedup_sec: 2.0
        voice_diagnostics_enabled: false
    voice_realtime_node:
      ros__parameters:
        realtime_provider: qwen
        model: qwen3.8-omni-flash-realtime
        voice: Tina
        idle_timeout_sec: 30.0
        vad_silence_ms: 700
        response_transition_timeout_sec: 5.0
        audio_chunk_ms: 100
        temperature: 0.1
        aec_sink: llm_aec_sink
        wake_ack_tail_ms: 150
        color_topic: /camera/camera/color/image_raw
    llm_visual_perception:
      ros__parameters:
        require_cuda_for_visual_perception: true
        sync_slop: 0.05
        sync_watchdog_sec: 3.0
        expected_camera_rate_hz: 30.0
environments:
  real:
    launch:
      use_sim_time: false
      camera_type: realsense
      camera_serial_no: ''
      color_profile: 1280x720x30
      depth_profile: 848x480x30
      pointcloud_enable: false
      use_rviz: true
      debug: false
      allow_trajectory_execution: true
      publish_monitored_planning_scene: true
      monitor_dynamics: false
      capabilities: ''
      disable_capabilities: ''
      publish_frequency: 100.0
      command_burst_count: 1
    nodes:
      llm_control_task_server:
        ros__parameters:
          moveit:
            readiness:
              allow_cross_client_fallback: false
  sim:
    launch:
      robot_profile: fairino_arm_gripper_inhand
      world: visual_world
      use_sim_time: true
      publish_frequency: 100.0
      enable_camera_model: true
      enable_camera_bridge: true
      camera_profile: d435_color_1280x720x30_depth_848x480x30
      camera_profile_file: ''
      camera_noise_mode: 'off'
      camera_depth_far_m: 3.0
      camera_fps: 30
      camera_image_width: 1280
      camera_image_height: 720
      spawn_z: 1.02
      controller_spawn_delay: 5.0
      command_burst_count: 1
