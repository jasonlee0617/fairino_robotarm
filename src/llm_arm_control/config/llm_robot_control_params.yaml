common:
  launch: {}
  nodes:
    llm_control_task_server:
      ros__parameters:
        yolo_topic: /yolo/detected_result
        depth_topic: /yolo/detected_result/depth
        camera_info_topic: /camera/camera/aligned_depth_to_color/camera_info
        pick_classes:
        - elongated_object
        - cube
        - stone
        place_classes:
        - box
        preview_max_age_sec: 30.0
        detection_max_age_sec: 1.0
        vision_wait_timeout_sec: 15.0
        moveit:
          frames:
            base_frame: base_link
            ee_frame: tool0
          groups:
            arm: robot_arm
            gripper: hand
          move_groups:
            fairino: /move_group_fairino
            kdl: /move_group_kdl
          ik:
            default: fairino
          pipeline:
            default: fairino
          planner:
            default: birrt*
          readiness:
            timeout_sec: 10.0
            allow_cross_client_fallback: true
        workspace_min_xy:
        - -0.9
        - -0.9
        workspace_max_xy:
        - 0.9
        - 0.9
        grasp_above: 0.04
        grasp_offset: 0.013
        place_offset: 0.08
        descend_to_box: 0.04
        grasp.elongated_object.roll: 0.0
        grasp.elongated_object.pitch: -180.0
        grasp.elongated_object.yaw_offset: 90.0
        grasp.cube.roll: 0.0
        grasp.cube.pitch: -180.0
        grasp.cube.yaw_offset: 0.0
        grasp.stone.roll: 0.0
        grasp.stone.pitch: -180.0
        grasp.stone.yaw_offset: -45.0
        pregrasp_pose.x: 0.1
        pregrasp_pose.y: 0.35
        pregrasp_pose.z: 0.3
        pregrasp_pose.roll: 0.0
        pregrasp_pose.pitch: -180.0
        pregrasp_pose.yaw: 100.0
        reset_stop_timeout_sec: 5.0
        arm_max_velocity: 0.2
        arm_max_acceleration: 0.2
        allowed_planning_time: 30.0
        use_continuous_yolo: true
        graspnet_poses_topic: /grasp/poses
        graspnet_scores_topic: /grasp/scores
        graspnet_metadata_topic: /grasp/metadata
        graspnet_max_candidates: 50
        graspnet_approach_distance_m: 0.08
        graspnet_grasp_offset_m: -0.01
        graspnet_lift_distance: 0.08
        graspnet_to_ee_rpy_deg:
        - 90.0
        - 0.0
        - 90.0
        graspnet_use_width: false
        graspnet_result_timeout_sec: 8.0
        graspnet_compute_timeout_sec: 600.0
    llm_visual_perception:
      ros__parameters:
        use_continuous_yolo: true
    graspnet_inference:
      ros__parameters:
        rgb_topic: /camera/camera/color/image_raw
        depth_topic: /camera/camera/aligned_depth_to_color/image_raw
        camera_info_topic: /camera/camera/aligned_depth_to_color/camera_info
        poses_topic: /grasp/poses
        scores_topic: /grasp/scores
        metadata_topic: /grasp/metadata
        preview_best_pose_topic: /graspnet_bringup/preview_best_pose
        preview_best_score_topic: /graspnet_bringup/preview_best_score
        base_frame: base_link
        num_point: 20000
        min_valid_points: 2000
        depth_min_m: 0.05
        depth_max_m: 5.0
        sync_queue_size: 10
        sync_slop_s: 0.05
        random_seed: 0
        min_grasp_width_m: 0.0
        max_grasp_width_m: 0.061
        support_plane_distance_m: 0.005
        support_plane_min_inlier_ratio: 0.2
        support_plane_max_tilt_deg: 15.0
        workspace_x_min_m: -0.3
        workspace_x_max_m: 0.3
        workspace_y_min_m: 0.0
        workspace_y_max_m: 0.6
        object_min_height_m: 0.0
        object_max_height_m: 0.15
        top_k_publish: 5
        collision_detection_enabled: true
        collision_voxel_size_m: 0.005
        collision_approach_distance_m: 0.08
        collision_threshold: 0.01
        confirm_before_publish: true
        confirm_visual_top_k: 50
        confirm_window_name: 'GraspNet: E=execute, B=preview raw best, ESC/Q=cancel'
environments:
  real:
    launch:
      use_sim_time: false
      camera_type: realsense
      camera_serial_no: ''
      color_profile: 1280x720x30
      depth_profile: 848x480x30
      pointcloud_enable: false
      use_rviz: true
      debug: false
      allow_trajectory_execution: true
      publish_monitored_planning_scene: true
      monitor_dynamics: false
      capabilities: ''
      disable_capabilities: ''
      publish_frequency: 100.0
      graspnet_model_profile: rs
      command_burst_count: 1
      use_continuous_yolo: true
    nodes:
      llm_control_task_server:
        ros__parameters:
          moveit:
            readiness:
              allow_cross_client_fallback: false
  sim:
    launch:
      robot_profile: fairino_arm_gripper_inhand
      world: visual_world
      use_sim_time: true
      publish_frequency: 100.0
      enable_camera_model: true
      enable_camera_bridge: true
      enable_servo: true
      camera_profile: d435_color_1280x720x30_depth_848x480x30
      camera_profile_file: ''
      camera_noise_mode: 'off'
      camera_depth_far_m: 3.0
      camera_fps: 30
      camera_image_width: 1280
      camera_image_height: 720
      spawn_z: 1.02
      controller_spawn_delay: 5.0
      command_burst_count: 1
      graspnet_model_profile: rs
      use_continuous_yolo: true
