common:
  launch: {}
  nodes:
    visual_grasping:
      ros__parameters:
        camera_frame: camera_color_optical_frame
        moveit:
          frames:
            base_frame: base_link
            ee_frame: tool0
          groups:
            arm: robot_arm
            gripper: hand
          move_groups:
            fairino: /move_group_fairino
            kdl: /move_group_kdl
          ik:
            default: fairino
          pipeline:
            default: fairino
          planner:
            default: birrt*
          readiness:
            timeout_sec: 10.0
            allow_cross_client_fallback: true
        max_step_size: 0.05
        arm_max_velocity: 0.2
        arm_max_acceleration: 0.2
        allowed_planning_time: 30.0
        position_tolerance: 0.005
        orientation_tolerance: 0.005
        allowed_start_tolerance: 0.1
        j2_constraint_position: -1.5708
        j2_constraint_tolerance: 1.5708
        num_candidate_plans: 5
        wrist_weight: 50.0
        wrist_joint_indices:
        - 2
        - 3
        - 4
        gripper_open_positions:
        - 0.0305
        - -0.0305
        gripper_close_positions:
        - 0.001
        - -0.001
        preferred_target: elongated_object
        target_priority:
        - elongated_object
        - cube
        - stone
        grasp_above: 0.04
        grasp_offset: 0.013
        place_offset: 0.08
        descend_to_box: 0.04
        action_delay: 0.5
        detection_timeout: 3.0
        control_period_sec: 0.2
        use_continuous_yolo: true
        pregrasp_pose.x: 0.1
        pregrasp_pose.y: 0.35
        pregrasp_pose.z: 0.3
        pregrasp_pose.roll: 0.0
        pregrasp_pose.pitch: -180.0
        pregrasp_pose.yaw: 100.0
        grasp.elongated_object.roll: 0.0
        grasp.elongated_object.pitch: -180.0
        grasp.elongated_object.yaw_offset: 90.0
        grasp.cube.roll: 0.0
        grasp.cube.pitch: -180.0
        grasp.cube.yaw_offset: 0.0
        grasp.stone.roll: 0.0
        grasp.stone.pitch: -180.0
        grasp.stone.yaw_offset: -45.0
    yolo_detector_obb:
      ros__parameters:
        rgb_topic: /camera/camera/color/image_raw
        depth_topic: /camera/camera/aligned_depth_to_color/image_raw
        camera_info_topic: /camera/camera/aligned_depth_to_color/camera_info
        sync_queue_size: 10
        sync_slop: 0.02
        depth_max_range: 10.0
        stride_elongated_object: 5
        stride_box: 1
        stride_cube: 1
        max_points: 5000
        min_points_elongated_object: 20
        min_points_box: 200
        min_points_cube: 50
        depth_inlier_m: 0.08
        depth_mad_scale: 3.0
        min_depth_inlier_ratio: 0.6
        axis_smoothing_alpha: 0.3
        xyz_smoothing_alpha: 0.8
        min_pca_yaw_quality: 0.3
        inference_period: 0.033
        pose_publish_rate: 30.0
        hold_last_seconds: 0.15
        use_continuous_yolo: true
environments:
  real:
    launch:
      use_sim_time: false
      camera_type: realsense
      camera_serial_no: ''
      color_profile: 1280x720x30
      depth_profile: 848x480x30
      pointcloud_enable: false
      use_rviz: true
      debug: false
      allow_trajectory_execution: true
      publish_monitored_planning_scene: true
      monitor_dynamics: false
      capabilities: ''
      disable_capabilities: ''
      publish_frequency: 100.0
      device: auto
      conf: 0.5
      imgsz: 1024
      use_continuous_yolo: true
    nodes:
      visual_grasping:
        ros__parameters:
          moveit:
            readiness:
              allow_cross_client_fallback: false
  sim:
    launch:
      robot_profile: fairino_arm_gripper_inhand
      world: visual_world
      enable_rviz: true
      use_sim_time: true
      publish_frequency: 30.0
      enable_camera_model: true
      enable_camera_bridge: true
      enable_servo: true
      camera_fps: 30
      camera_image_width: 1280
      camera_image_height: 720
      camera_profile: d435_color_1280x720x30_depth_848x480x30
      camera_profile_file: ''
      camera_noise_mode: 'off'
      camera_depth_far_m: 3.0
      spawn_z: 1.02
      controller_spawn_delay: 5.0
      calibration_name: robot_calibration
      camera_mode: eye_in_hand
      imgsz: 1024
      conf: 0.5
      use_continuous_yolo: true
