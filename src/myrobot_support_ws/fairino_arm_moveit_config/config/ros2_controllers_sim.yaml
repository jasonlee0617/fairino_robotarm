# This config file is used by ros2_control in Gazebo simulation.
controller_manager:
  ros__parameters:
    # Both controller managers use 500 Hz; command interfaces differ by backend.
    update_rate: 500

    robot_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

robot_arm_controller:
  ros__parameters:
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity

    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    interpolation_method: splines
    cmd_timeout: 0.0

    constraints:
      goal_time: 0.5
      stopped_velocity_tolerance: 0.1
      j1: {trajectory: 0.30, goal: 0.15}
      j2: {trajectory: 0.30, goal: 0.15}
      j3: {trajectory: 0.30, goal: 0.15}
      j4: {trajectory: 0.30, goal: 0.15}
      j5: {trajectory: 0.30, goal: 0.15}
      j6: {trajectory: 0.30, goal: 0.15}

    gains:
      j1:
        p: 6.0
        i: 0.02
        d: 0.20
        ff_velocity_scale: 1.0
        i_clamp_min: -0.5
        i_clamp_max: 0.5
        u_clamp_min: -2.0
        u_clamp_max: 2.0
        antiwindup_strategy: none
        error_deadband: 0.001
      j2:
        p: 6.0
        i: 0.02
        d: 0.20
        ff_velocity_scale: 1.0
        i_clamp_min: -0.5
        i_clamp_max: 0.5
        u_clamp_min: -2.0
        u_clamp_max: 2.0
        antiwindup_strategy: none
        error_deadband: 0.001
      j3:
        p: 4.0
        i: 0.02
        d: 0.20
        ff_velocity_scale: 1.0
        i_clamp_min: -0.5
        i_clamp_max: 0.5
        u_clamp_min: -2.0
        u_clamp_max: 2.0
        antiwindup_strategy: none
        error_deadband: 0.001
      j4:
        p: 3.0
        i: 0.01
        d: 0.15
        ff_velocity_scale: 1.0
        i_clamp_min: -0.5
        i_clamp_max: 0.5
        u_clamp_min: -2.0
        u_clamp_max: 2.0
        antiwindup_strategy: none
        error_deadband: 0.001
      j5:
        p: 3.0
        i: 0.01
        d: 0.15
        ff_velocity_scale: 1.0
        i_clamp_min: -0.5
        i_clamp_max: 0.5
        u_clamp_min: -2.0
        u_clamp_max: 2.0
        antiwindup_strategy: none
        error_deadband: 0.001
      j6:
        p: 2.0
        i: 0.01
        d: 0.12
        ff_velocity_scale: 1.0
        i_clamp_min: -0.5
        i_clamp_max: 0.5
        u_clamp_min: -2.0
        u_clamp_max: 2.0
        antiwindup_strategy: none
        error_deadband: 0.001

hand_controller:
  ros__parameters:
    allow_nonzero_velocity_at_trajectory_end: false
    joints:
      - finger1_joint
      - finger2_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
