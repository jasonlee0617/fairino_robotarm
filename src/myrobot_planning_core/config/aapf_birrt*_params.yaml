fairino:
  algorithms:
    aapf_birrt_star:
      max_iterations: 3000
      post_solution_sample_attempts: 50
      max_step: 0.20
      goal_threshold: 0.08
      goal_bias: 0.20
      gamma: 1.5
      max_rewire_radius: 0.25
      max_near: 20
      validation_distance: 0.05

      connect_max_steps: 20
      connect_goal_bias: 0.12
      rewire_every_k: 3
      rewire_max_neighbors: 5

      aapf:
        enable: true
        repulsion_range_m: 0.24
        stall_threshold_iters: 120
        strict_validation_distance: 0.03
        adaptive_window: 32
        adaptive_exploration: 0.7
        global_min_period: 8
        min_rewire_radius_ratio: 1.2
        shrink_motion_initial_scale: 0.5
        shrink_motion_decay: 0.5
        shrink_motion_attempts: 4
        bridge_node_sep_ratio: 0.25

      orientation:
        near_dist: 0.12
        ori_gate_dist: 0.12
        ori_far_tol_deg: 180.0
        ori_near_tol_deg: 1.0
        ori_weight_far: 0.0
        ori_weight_near: 1.0
