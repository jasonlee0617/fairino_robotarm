fairino:
  optimizer:
    validation_distance: 0.03
    shortcut_trials: 80
    pull_trials: 30
    densify_max_spacing: 0.06
    pull_alpha_min: 0.10
    pull_alpha_max: 0.90
    orientation_check_count: 3

  trajectory:
    waypoint_dt: 0.08

  pipeline:
    default_obstacle_origin: [0.0, 0.30, 0.10]
    default_obstacle_size: [0.30, 0.05, 0.20]

  safety:
    final_validation_distance: 0.03

  planner:
    planning_deadline_s: 30.0
    enable_path_optimizer: true
    optimizer_fail_open_return_original: true
    final_validation_fail_open: false
    use_multi_obstacle_input: true
    min_obstacle_size_threshold: 0.001
    random_seed: 0
