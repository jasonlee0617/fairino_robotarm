environments:
  real:
    launch:
      use_sim_time: false
      camera_serial_no: ''
      color_profile: 640x480x60
      depth_profile: 640x480x60
      pointcloud_enable: false
      use_rviz: true
      debug: false
      allow_trajectory_execution: true
      publish_monitored_planning_scene: true
      monitor_dynamics: false
      capabilities: ''
      disable_capabilities: ''
      publish_frequency: 100.0
    nodes:
      visual_position_servo:
        moveit:
          readiness: {allow_cross_client_fallback: false}
        task:
          above_offset: 0.2
          home_pose: {xyz: [0.1, 0.3, 0.25], rpy_deg: [0.0, -180.0, 100.0]}
        planning:
          target_above_rpy_deg: [0.0, -180.0, 100.0]
        runtime: {position_servo_rate_hz: 250.0}
  sim:
    launch:
      camera:
        camera_profile: d435_color_640x480x60_depth_640x480x60
        camera_noise_mode: 'off'
        camera_fps: 60
        camera_image_width: 640
        camera_image_height: 480
      target_motion:
        cube:
          model_name: cube_model
          cmd_topic: /model/cube_model/cmd_vel
          cmd_internal_topic: /cube_truth/cmd_vel_command_internal
          auto_start_topic: /cube_auto_start
          trajectory_type: circle
          linear_x: 0.05
          linear_y: 0.0
          angular_z: 0.5
          rect_length_x: 0.2
          rect_length_y: 0.2
          rect_speed: 0.05
          max_motion_time: 30.0
          auto_start: false
          startup_hold_sec: 0.005
          publish_rate: 30.0
        aruco:
          model_name: aruco_marker_model
          cmd_topic: /model/aruco_marker_model/cmd_vel
          cmd_internal_topic: /aruco_truth/cmd_vel_command_internal
          auto_start_topic: /aruco_marker_auto_start
          trajectory_type: circle
          linear_x: 0.05
          linear_y: 0.0
          angular_z: 0.5
          rect_length_x: 0.2
          rect_length_y: 0.2
          rect_speed: 0.05
          max_motion_time: 30.0
          auto_start: false
          startup_hold_sec: 0.005
          publish_rate: 30.0
      use_sim_time: true
      camera_profile_file: ''
      camera_depth_far_m: 10.0
      robot_profile: fairino3_v6 # fairino3_v6 / fairino_arm_gripper_onbase
    nodes:
      visual_position_servo:
        task:
          above_offset: 0.22
          home_pose: {xyz: [-0.2, 0.25, 0.25], rpy_deg: [0.0, -180.0, 0.0]}
        planning:
          target_above_rpy_deg: [-45.0, -180.0, 0.0]
        runtime: {position_servo_rate_hz: 250.0}
common:
  launch: {}
  nodes:
    visual_position_servo:
      task:
        preferred_target: cube
        target_priority: [cube, elongated_object, box, stone]
        open_gripper_after_home: false
        action_delay: 0.5
        detection_timeout: 3.0
        num_candidate_plans: 5
        wrist_weight: 50.0
        wrist_joint_indices: [2, 3, 4]
      planning:
        camera_frame: camera_color_optical_frame
        arm_max_velocity: 0.2
        arm_max_acceleration: 0.2
        allowed_planning_time: 15.0
        position_tolerance: 0.005
        orientation_tolerance: 0.005
        allowed_start_tolerance: 0.1
        j2_constraint_position: -1.5708
        j2_constraint_tolerance: 1.5708
      runtime:
        servo_ns: /servo_node
        servo_qos_mode: modern
        servo_qos_cmd_reliability: reliable
        servo_qos_cmd_durability: volatile
        servo_qos_cmd_depth: 1
        servo_qos_status_reliability: reliable
        servo_qos_status_durability: volatile
        servo_qos_status_depth: 1
        servo_align_xyz_tol: 0.001
        servo_status_decel_codes: [1, 6]
        servo_status_halt_codes: [2, 4, 5]
        aligned_stable_count: 80
      perception:
        active_source: yolo_kalman # yolo_kalman / aruco
        yolo_kalman:
          backend: tensorrt
          model_path: yolo-obb-640.engine
          engine_path: yolo-obb-640.engine
          device: auto
          imgsz: 640
          conf: 0.5
          rgb_topic: /camera/camera/color/image_raw
          depth_topic: /camera/camera/aligned_depth_to_color/image_raw
          camera_info_topic: /camera/camera/aligned_depth_to_color/camera_info
          depth_max_range: 10.0
          stride_elongated_object: 5
          stride_box: 10
          stride_cube: 1
          max_points: 5000
          min_points_elongated_object: 20
          min_points_box: 200
          min_points_cube: 50
          depth_inlier_m: 0.08
          depth_mad_scale: 3.0
          min_depth_inlier_ratio: 0.6
          axis_smoothing_alpha: 0.3
          min_pca_yaw_quality: 0.3
          inference_period: 0.0166
          pose_publish_rate: 60.0
          hold_last_seconds: 0.13
          yaw_smoothing_alpha: 0.3
          xyz_smoothing_alpha: 0.8
          use_kalman_filter: true
          kf_q_pos: 0.0001
          kf_q_vel: 0.003
          kf_r_xyz: 0.02
          kf_max_xyz_jump: 0.025
          kf_q_yaw: 0.001
          kf_q_yaw_rate: 0.05
          kf_r_yaw: 0.003
          max_predict_seconds: 0.04
          max_missed_frames: 6
          sync_queue_size: 10
          sync_slop: 0.015
        aruco:
          detection:
            marker_size_m: 0.07
            dictionary: DICT_5X5_250
            image_topic: /camera/camera/color/image_raw
            camera_info_topic: /camera/camera/color/camera_info
            camera_frame: camera_color_optical_frame
            detector:
              # OpenCV DetectorParameters defaults; explicit here so launch overrides are auditable.
              adaptive_thresh_win_size_min: 3
              adaptive_thresh_win_size_max: 23
              adaptive_thresh_win_size_step: 10
              adaptive_thresh_constant: 7.0
              min_marker_perimeter_rate: 0.03
              max_marker_perimeter_rate: 4.0
              polygonal_approx_accuracy_rate: 0.03
              corner_refinement_method: none
              corner_refinement_win_size: 5
              corner_refinement_max_iterations: 30
              corner_refinement_min_accuracy: 0.1
          position_source:
            marker_id: 1
            input_topic: /aruco_markers
            output_topic: /aruco_marker/pose
          visualization:
            image_topic: /aruco_marker/visualization
            marker_id: 1
          tracking:
            prediction_hold_sec: 0.50
          motion_auto_start_topic: /aruco_marker_auto_start
      moveit:
        frames: {base_frame: base_link, ee_frame: tool0}
        groups: {arm: robot_arm, gripper: hand}
        move_groups: {fairino: /move_group_fairino, kdl: /move_group_kdl}
        ik: {default: fairino}
        pipeline: {default: fairino}
        planner: {default: tube_birrt*}
        readiness: {timeout_sec: 10.0, allow_cross_client_fallback: true}
        ik_moveit_servo: kdl
      controllers:
        active: NLADRC
        profiles:
          PID:
            tuning:
              pid_kp: 15.0
              pid_ki: 6.0
              pid_kd: 0.0
              pid_d_ema_alpha: 0.8
              pid_derivative_clip: 1.0
              pid_integral_limit: 0.003
              pid_integral_active_radius: 0.01
              pid_integral_decay: 0.94
              pid_u_max: 1.0
            tracking:
              v_xyz_max: 1.0
              a_xyz_max: 1.0
              twist_norm_max: 1.0
              status1_speed_scale: 0.4
              predict_lead_sec: 0.055
              max_predict_horizon: 0.12
              servo_detection_timeout: 0.14
              cmd_lpf_alpha: 0.7
              vel_ff_gain: 1.3
              rel_vel_damping_gain: 1.2
              ff_vel_ema_alpha: 0.75
              max_target_speed: 1.0
              target_vxyz_clip: 1.0
              meas_jump_clip_xyz: 0.004
              ee_vel_ema_alpha: 0.7
              rel_vel_clip: 1.0
              ff_term_clip: 1.0
              target_accel_ema_alpha: 0.25
