common:
  launch:
    solver_type: nmpc
    planner_id: birrt*
    ik_plugin: fairino
    planning_pipeline_id: fairino
    arm_max_velocity: 1.0
    arm_max_acceleration: 1.0
    allowed_planning_time: 30.0
    position_tolerance: 0.005
    orientation_tolerance: 0.05
    use_sim_time: true
  nodes:
    mpc_avoidance_node:
      ros__parameters:
        solver_type: nmpc

        # --------------------------------------------------------------------------
        # 1) Time & Horizon
        # dt [s]: 控制周期。越小响应越快但计算负载更高。
        # N [-]: 预测步长数。预测时域≈dt*N。
        # --------------------------------------------------------------------------
        dt: 0.02
        N: 15

        # --------------------------------------------------------------------------
        # 2) Cost Weights
        # track_weight: 轨迹位置跟踪权重（大=更贴轨迹，可能更“硬”）
        # vel_weight:   速度跟踪/抑制权重（大=速度变化更保守）
        # control_weight: 控制输入ddq惩罚（大=加速度更平滑）
        # terminal_weight: 终端状态权重（大=更重视到终点）
        # --------------------------------------------------------------------------
        track_weight: 300.0
        vel_weight: 1.0
        control_weight: 4.0
        terminal_weight: 40.0

        # --------------------------------------------------------------------------
        # 3) Safety Margins [m]
        # safe_dist: 与障碍物最小安全距离
        # clear_margin: 判定安全区阈值（用于状态机/死锁逻辑）
        # --------------------------------------------------------------------------
        safe_dist: 0.12
        clear_margin: 0.10

        # --------------------------------------------------------------------------
        # 4) Obstacle Potential / APF
        # obs_weight: 避障代价基权重
        # alpha_pen:  势场形状参数
        # buffer_zone [m]: APF激活缓冲区，阈值 = safe_dist + buffer_zone
        # obs_exp_clip: 指数项截断，避免数值爆炸
        # kappa: 势场曲率参数
        # points_per_link: 每连杆采样点数量（距离估计精度）
        # vel_obs_expand_gain: 速度膨胀系数（障碍越快，等效尺寸越大）
        # --------------------------------------------------------------------------
        obs_weight: 200.0
        alpha_pen: 5.0
        buffer_zone: 0.08          # APF threshold = safe_dist + buffer_zone
        obs_exp_clip: 10.0
        kappa: 10.0
        points_per_link: 3
        vel_obs_expand_gain: 1.2

        # --------------------------------------------------------------------------
        # 5) Adaptive Weights (sigmoid)
        # transition_margin [m]: 自适应过渡中心
        # steepness: Sigmoid陡峭度（大=切换更激烈，易造成锯齿）
        # obs_scale_max: 避障权重最大放大倍数
        # track_scale_min: 跟踪权重最小保留比例（越低越容易“只避障不走轨”）
        # vel_scale_min / term_scale_min: 速度/终端权重最小比例
        # --------------------------------------------------------------------------
        adapt.transition_margin: 0.08
        adapt.steepness: 40.0
        adapt.obs_scale_max: 3.0
        adapt.track_scale_min: 0.55
        adapt.vel_scale_min: 0.5
        adapt.term_scale_min: 0.5

        # --------------------------------------------------------------------------
        # 6) Lateral Avoidance Bias Assist [deg/s or m]
        # 横向避障辅助，不让系统陷入只沿参考爬行。
        # --------------------------------------------------------------------------
        avoidance_bias_lateral_speed_deg: 5.0
        avoidance_bias_forward_speed_deg: 3.0
        avoidance_bias_activation_speed_deg: 3.0
        avoidance_bias_clear_hysteresis: 0.03
        avoidance_bias_decay_steps: 10

        # --------------------------------------------------------------------------
        # 7) CBF-MPC NLP Fusion
        # cbf_mpc.weight: 软约束惩罚（过大可能导致QP病态）
        # cbf_mpc.gamma:  NLP内CBF收敛速度
        # --------------------------------------------------------------------------
        cbf_mpc.enabled: true
        cbf_mpc.weight: 5000.0
        cbf_mpc.gamma: 10.0

        # --------------------------------------------------------------------------
        # 8) Arc-length Following
        # ds_physical_ratio: 弧长推进比例
        # min_speed_ratio:   最低速度比例（低=更稳但慢）
        # replan_progress_thresh: 到后段仍未收敛时触发重规划阈值
        # --------------------------------------------------------------------------
        ds_physical_ratio: 0.5
        min_speed_ratio: 0.30
        replan_progress_thresh: 0.98
        arc_follow_recover_margin_band: 0.03
        goal_phase_s_progress_threshold: 0.95
        goal_phase_s_progress_span: 0.05
        progress_stall_eps: 1.0e-4
        arc_follow_search_range: 0.25
        arc_follow_search_samples: 40
        arc_follow_fine_samples: 20
        arc_follow_backward_allowance: 0.2
        arc_follow_min_segment_length: 1.0e-10

        # --------------------------------------------------------------------------
        # 9) Deadlock / Replan
        # 本地MPC先恢复；仅持续静态前视碰撞可请求一次 BiRRT* 重规划。
        # APF和避障偏置只用于本地控制，不再作为全局路径失效依据。
        # --------------------------------------------------------------------------
        deadlock_min_progress_per_sec: 0.01
        deadlock_progress_window_sec: 1.0
        progress_stall_threshold_steps: 25
        deadlock_clearance_improvement_min: 0.01
        deadlock_local_recovery_sec: 2.0
        deadlock_static_block_confirm_sec: 1.0
        deadlock_replan_cooldown_sec: 8.0
        deadlock_reference_lookahead_sec: 1.0
        deadlock_reference_escape_prefix_sec: 0.3
        deadlock_dynamic_clear_confirm_sec: 1.0
        deadlock_replan_max_per_goal: 1
        deadlock_goal_identity_tolerance_rad: 0.001
        obstacle_tracker_velocity_window_sec: 0.5
        obstacle_tracker_dynamic_speed_threshold: 0.01

        # --------------------------------------------------------------------------
        # 10) Goal Check [deg]
        # --------------------------------------------------------------------------
        goal_joint_err_deg: 3.0
        terminal_goal_err_deg: 8.0

        # --------------------------------------------------------------------------
        # 11) Variable-step Prediction
        # --------------------------------------------------------------------------
        enable_variable_step: true
        dt_fine: 0.02
        dt_coarse: 0.04
        n_fine: 4

        # --------------------------------------------------------------------------
        # 12) Joint & Command Limits [deg]
        # dq_max_deg: 物理/求解器速度边界（MPC可行域）
        # command_*: 控制输出边界（发给控制器前的二次限幅，通常应更保守）
        # command_smoothing_alpha: 输出低通混合系数（小=更平滑）
        # mpc_initial_dq_limit_ratio / settling_dq_limit_ratio: 初始状态可行性保护
        # --------------------------------------------------------------------------
        dq_max_deg: [120.0, 120.0, 120.0, 160.0, 160.0, 180.0]
        command_dq_limit_deg: [30.0, 30.0, 30.0, 40.0, 40.0, 50.0]
        command_step_limit_deg: [1.2, 1.2, 1.2, 1.6, 1.6, 2.0]
        command_delta_dq_limit_deg: [8.0, 8.0, 8.0, 12.0, 12.0, 16.0]
        command_time_from_start: 0.10
        command_smoothing_alpha: 0.2
        mpc_initial_dq_limit_ratio: 0.8
        settling_dq_limit_ratio: 0.8
        mpc_failure_cooldown_steps: 8
        q_min_deg: [-175.0, -265.0, -162.0, -265.0, -175.0, -175.0]
        q_max_deg: [175.0, 85.0, 162.0, 85.0, 175.0, 175.0]

        # --------------------------------------------------------------------------
        # 13) Joint Name Mapping
        # --------------------------------------------------------------------------
        joint_names:
          - j1
          - j2
          - j3
          - j4
          - j5
          - j6

        # --------------------------------------------------------------------------
        # 14) Dynamic Obstacle Bounds
        # 统一来自 obstacle_stack.yaml (scenario 段)，避免多处硬编码。
        # --------------------------------------------------------------------------
        # 从 obstacle_stack.yaml 统一加载，obstacle_simulator 与 MPC 节点共享。

        # --------------------------------------------------------------------------
        # 15) Misc
        # --------------------------------------------------------------------------
        group_name: robot_arm
        log_interval: 20
        casadi.apf_fd_eps: 0.001

        # --------------------------------------------------------------------------
        # 16) NMPC Overrides
        # 未列出的 nmpc.* 参数回退到 Loader 默认值。
        # --------------------------------------------------------------------------
        nmpc.dt: 0.02
        nmpc.N: 15

environments:
  sim:
    launch:
      robot_profile: fairino3_v6  # fairino3_v6/fairino_arm_gripper_onbase
      world_name: empty
      enable_rviz: true
    nodes:
      mpc_avoidance_node:
        ros__parameters:
          use_sim_time: true
          enable_moveit_scene: true
          controller_topic: /robot_arm_controller/joint_trajectory
      obstacle_simulator:
        ros__parameters:
          use_sim_time: true
          world_name: empty
      mpc_avoidance_demo_node:
        ros__parameters:
          use_sim_time: true
          group_name: robot_arm
          ee_link: tool0
          base_frame: base_link
          joint_names: [j1, j2, j3, j4, j5, j6]
          controller_topic: /robot_arm_controller/joint_trajectory
          ik_plugin: fairino
          planning_pipeline_id: fairino
